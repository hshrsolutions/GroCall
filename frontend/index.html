<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>{{ brand.name or "GroCall" }}</title>
		<meta name="theme-color" content="{{ brand.accent or '#0f766e' }}" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<link rel="manifest" href="/assets/grocall/manifest.json" />
		<link rel="icon" href="/assets/grocall/icon.svg" type="image/svg+xml" />
	</head>
	<body>
		<div id="app"></div>
		<script>
			window.csrf_token = "{{ csrf_token }}"
			window.site_name = "{{ site_name }}"
			if (!window.frappe) window.frappe = {}
			frappe.boot = {{ boot | tojson }}
		</script>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
