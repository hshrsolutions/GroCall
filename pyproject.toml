[project]
name = "grocall"
authors = [
    { name = "HSHR Solutions", email = "support@hshrsolutions.com"}
]
description = "GroCall — sales call recording & tracking: company-SIM call log, recordings, follow-ups, missed-call alerts, manager reports, AI summaries"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
